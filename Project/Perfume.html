<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Card</title>
    <link rel="stylesheet" href="../Project/perfume.css">
</head>
<body>

    <div class="card">
      
        <div class="card-image">
            <img src="../Project/image-product-desktop.jpg" 
                 alt="Gabrielle CHANEL Perfume">
        </div>

        <!-- CONTENT -->
        <div class="card-content">
            <span class="category">Perfume</span>
            <h1 class="title">Gabrielle<br>Essence Eau<br>De Parfum</h1>
            <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge for CHANEL.</p>
            <div class="price">
                <span class="current">$149.99</span>
                <span class="original">$169.99</span>
            </div>
            <button class="btn">🛒 Add to Cart</button>
        </div>
    </div>

</body>
</html>
