<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Basics</title>

    <style>
        /* This is a CSS comment */

        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Element Selector */
        h1 {
            color: limegreen;
            font-size: 60px;
            font-weight: normal;
            text-decoration: underline;
            text-transform: uppercase;
            border: 3px solid pink;
            padding: 20px;
            margin: 20px;
            text-align: center;
        }

        p {
            font-size: 20px;
            color: #333;
            margin: 20px;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

    <h1>This is an h1.</h1>

    <p>
        This is a paragraph demonstrating basic CSS styling.
    </p>

</body>
</html>
